<div class="border border-neutral-200 rounded-lg p-3 hover:shadow-md transition">
  <a [routerLink]="['/product', product.id]" class="block">
    <img
      [src]="product.imageUrl"
      [alt]="product.name"
      class="w-full aspect-square object-contain mb-2 bg-neutral-50"
    />
  </a>
  <span class="text-xs font-medium text-neutral-600 uppercase">{{ product.brand }}</span>
  <a [routerLink]="['/product', product.id]" class="block">
    <h4 class="text-sm font-medium text-neutral-800 line-clamp-2 min-h-8 mb-4">{{ product.name }}</h4>
  </a>
  <p class="text-xs text-neutral-400 line-through">
    Reg: S/ {{ product.regularPrice | number: '1.2-2' }}
  </p>
  <p class="text-base font-medium text-red-600">S/ {{ product.onlinePrice | number: '1.2-2' }}</p>
  @if (product.ohPrice) {
    <p class="text-xs text-neutral-500">oh! S/ {{ product.ohPrice | number: '1.2-2' }}</p>
  }
  <button
    (click)="addToCart()"
    type="button"
    class="w-full mt-6 text-sm font-medium py-1.5 rounded-full border border-red-600 text-red-600 hover:bg-red-600 hover:text-white transition"
  >
    {{ added() ? 'AGREGADO' : 'AGREGAR' }}
  </button>
</div>
