<section class="max-w-7xl mx-auto px-4 mt-8">
  <div
    class="bg-rose-500 text-white rounded-t-2xl px-6 py-4 flex items-center justify-center gap-4 mb-4"
  >
    <img src="/LogoPlazaVeaV2.svg" alt="plazaVea" class="h-10" />
    <span class="font-medium text-2xl">¡solo por hoy!</span>
    <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
      />
    </svg>
    <span class="font-mono text-xl">
      {{ timerHours() < 10 ? '0' + timerHours() : timerHours() }}h
      {{ timerMinutes() < 10 ? '0' + timerMinutes() : timerMinutes() }}m
      {{ timerSeconds() < 10 ? '0' + timerSeconds() : timerSeconds() }}s
    </span>
  </div>
  <div class="grid grid-cols-3 gap-4 w-full mb-4">
    @for (image of images; track image) {
      <img [src]="image" alt="" class="w-full aspect-[16/9] object-cover rounded-md" />
    }
  </div>
</section>
