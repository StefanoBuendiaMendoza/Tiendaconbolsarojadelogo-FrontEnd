<section class="max-w-330 mx-auto px-4 py-12">
  <h3 class="text-2xl font-medium text-neutral-900 tracking-tight mb-4">
    Los más vendidos en Supermercado
  </h3>
  <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3.5">
    @for (product of products; track product.id) {
      <app-product-card [product]="product" />
    }
  </div>
</section>
