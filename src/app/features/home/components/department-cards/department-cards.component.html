<section class="max-w-7xl mx-auto px-4 mt-6">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    @for (dept of departments(); track dept.id) {
      <div
        class="bg-neutral-200/50 rounded-md p-6 flex items-center justify-between gap-4 shadow-md"
      >
        <div>
          <h3 class="text-xl sm:text-2xl font-medium text-neutral-900">{{ dept.title }}</h3>
          <p class="text-md text-neutral-800 mt-2 max-w-sm">{{ dept.description }}</p>
        </div>
        <a
          [routerLink]="['/' + (dept.id === 'electro' ? 'electrohogar' : dept.id)]"
          class="bg-red-800 text-white font-medium px-5 py-2 rounded-full shrink-0"
        >
          {{ dept.buttonText }}
        </a>
      </div>
    }
  </div>
</section>
