<section class="relative w-full h-60 sm:h-80 md:h-100">
  @for (banner of heroBanners(); track banner.id; let idx = $index) {
    <img
      [src]="banner.imageUrl"
      class="absolute inset-0 w-full h-full object-cover"
      [class.opacity-100]="idx === currentBannerIndex()"
      [class.opacity-0]="idx !== currentBannerIndex()"
    />
  }
  <button
    (click)="prevBanner()"
    type="button"
    class="absolute left-3 top-1/2 -translate-y-1/2 bg-black/40 text-white w-9 h-9 rounded-full cursor-pointer"
  >
    ❮
  </button>
  <button
    (click)="nextBanner()"
    type="button"
    class="absolute right-3 top-1/2 -translate-y-1/2 bg-black/40 text-white w-9 h-9 rounded-full cursor-pointer"
  >
    ❯
  </button>
</section>
<div class="flex justify-center gap-2 mt-6">
  @for (banner of heroBanners(); track banner.id; let idx = $index) {
    <button
      (click)="setBanner(idx)"
      type="button"
      class="w-3 h-3 rounded-full cursor-pointer"
      [class.bg-red-600]="idx === currentBannerIndex()"
      [class.bg-neutral-300]="idx !== currentBannerIndex()"
    ></button>
  }
</div>
