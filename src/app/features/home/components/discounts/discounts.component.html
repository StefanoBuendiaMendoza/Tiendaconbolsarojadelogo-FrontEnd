<section class="max-w-7xl mx-auto px-4 mt-12">
  <div class="bg-[#ea0029] text-white rounded-lg px-6 py-4 text-center mb-4">
    <span class="font-medium text-2xl">Descuentos</span>
  </div>
  <div class="grid grid-cols-3 gap-4 mb-4 w-full">
    @for (image of images.slice(0, 3); track image) {
      <img [src]="image" alt="" class="w-full h-64 object-cover rounded-lg" />
    }
  </div>
  <div class="grid grid-cols-2 gap-4 mb-4 w-full">
    @for (image of images.slice(3, 5); track image) {
      <img [src]="image" alt="" class="w-full h-64 object-cover rounded-lg" />
    }
  </div>
  <div class="grid grid-cols-3 gap-4 w-full">
    @for (image of images.slice(5); track image) {
      <img [src]="image" alt="" class="w-full h-64 object-cover rounded-lg" />
    }
  </div>
</section>
